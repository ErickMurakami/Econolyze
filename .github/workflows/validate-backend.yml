name: Validate backend

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, financial-service, gateway-service, ai-service]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp -f services/${{ matrix.service }}/pom.xml clean verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/target/surefire-reports/
            services/${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: warn

  postgres-integration:
    name: Verify financial PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify PostgreSQL integration
        run: mvn -B -ntp -f services/financial-service/pom.xml -Pintegration clean verify

      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-financial-postgres
          path: |
            services/financial-service/target/surefire-reports/
            services/financial-service/target/failsafe-reports/
            services/financial-service/target/site/jacoco/
          if-no-files-found: warn
