quarkus:
  application:
    name: gateway-service

  ssl:
    native: true

  http:
    host: 0.0.0.0
    port: 8080

    auth:
      permission:
        public-routes:
          paths: "/api/auth/*,/swagger-ui/*,/q/openapi/*"
          policy: permit

    cors:
      enabled: true
      origins: "http://localhost:5173,http://localhost:3000,http://192.168.3.32:3000,http://192.168.3.9:3000,https://econolyze.vercel.app,https://api.erickkami.dev"
      methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
      headers: "accept,authorization,content-type,x-requested-with,x-xsrf-token,cookie"
      exposed-headers: "*"
      access-control-allow-credentials: true
      access-control-max-age: 24H

    ssl:
      certificate:
        files: ${TLS_CERTIFICATE_FILES:/work/ssl/cert.pem}
        key-files: ${TLS_KEY_FILES:/work/ssl/key.pem}
    insecure-requests: enabled

  # Swagger
  swagger-ui:
    always-include: true
    path: /swagger-ui

  # Logging
  log:
    level: INFO
    category:
      "dev.econolyze":
        level: INFO
      "io.quarkus.smallrye.jwt":
        level: INFO
      "io.quarkus.security":
        level: INFO
      "io.smallrye.jwt":
        level: INFO
      "org.jboss.resteasy.reactive.client":
        level: INFO

  # REST Clients
  rest-client:
    auth-service:
      url: ${AUTH_SERVICE_URL:http://auth-service:8081}
      scope: jakarta.inject.Singleton
    financial-service:
      url: ${FINANCIAL_SERVICE_URL:http://financial-service:8082}
      scope: jakarta.inject.Singleton
    ai-service:
      read-timeout: 120000
      url: ${AI_SERVICE_URL:http://ai-service:8083}
      scope: jakarta.inject.Singleton

mp:
  jwt:
    verify:
      publickey:
        location: keys/publicKey.pem
      issuer: econolyze

"%dev":
  quarkus:
    log:
      console:
        format: "%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n"
        color: true

"%prod":
  quarkus:
    rest-client:
      auth-service:
        url: ${AUTH_SERVICE_URL}
      financial-service:
        url: ${FINANCIAL_SERVICE_URL}
      ai-service:
        url: ${AI_SERVICE_URL}
